services:
  huiszoeker:
    build: .
    container_name: huiszoeker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    shm_size: 512m
  webinterface:
    build: .
    container_name: huiszoeker-web
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./data:/app/data
    command: python web.py


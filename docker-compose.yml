services:
  byparr:
    build: ./docker/byparr
    image: huiszoeker-byparr:patched
    container_name: byparr
    restart: unless-stopped
    init: true
    environment:
      - LOG_LEVEL=info
      - BYPARR_POST_DOM_WAIT_SEC=2.5
    shm_size: 512m
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 2G
    networks:
      - huiszoeker_default

  huiszoeker:
    build: .
    container_name: huiszoeker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - PYTHONPATH=/app/backend:/app
    volumes:
      - ./data:/app/data
      - ${DATA_DIR:-/mnt/ssd}/huursignal/datalake:/app/datalake
    shm_size: 512m
    depends_on:
      - byparr

  webinterface:
    build: .
    container_name: huiszoeker-web
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./data:/app/data
      - ${DATA_DIR:-/mnt/ssd}/huursignal/datalake:/app/datalake
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - PYTHONPATH=/app/frontend:/app/backend:/app
    command: gunicorn -w 4 -b 0.0.0.0:5000 --timeout 180 web:app

networks:
  huiszoeker_default:
    external: true
  arr-stack_default:
    external: true

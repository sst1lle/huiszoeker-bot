version: '3.9'
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info

  huiszoeker:
    build: .
    container_name: huiszoeker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    volumes:
      - ./data:/app/data
    shm_size: 512m
    depends_on:
      - flaresolverr

  webinterface:
    build: .
    container_name: huiszoeker-web
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
    command: gunicorn -w 4 -b 0.0.0.0:5000 web:app

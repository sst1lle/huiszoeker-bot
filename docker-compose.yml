version: '3.9'
services:
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      - LOG_LEVEL=info

  huiszoeker:
    build: .
    container_name: huiszoeker
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    shm_size: 512m
    depends_on:
      - flaresolverr

  webinterface:
    build: .
    container_name: huiszoeker-web
    restart: unless-stopped
    ports:
      - '5000:5000'
    volumes:
      - ./data:/app/data
    command: python web.py

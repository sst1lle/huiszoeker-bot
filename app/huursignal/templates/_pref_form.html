<div class="form-card">
  <div class="err" id="err"></div>
  <div class="ok"  id="ok">Opgeslagen!</div>
  <p class="section-label">Jouw gegevens</p>
  <div class="field">
    <label>Naam</label>
    <input type="text" id="naam" value="{{ pref.naam or '' }}" placeholder="Je naam">
  </div>
  <div class="field">
    <label>Telegram chat ID <span style="font-weight:400;color:#a1a1aa">(optioneel)</span></label>
    <input type="text" id="telegram" value="{{ pref.telegram_chat_id or '' }}" placeholder="bijv. 1234567890">
    <p class="hint">Stuur /start naar @userinfobot om je chat ID te achterhalen</p>
  </div>
  <p class="section-label">Zoekvoorkeuren</p>
  <div class="field">
    <label>Stad</label>
    <input type="text" id="stad" value="{{ pref.stad or '' }}" placeholder="bijv. den-haag">
    <p class="hint">Formaat: den-haag, amsterdam, rotterdam, utrecht</p>
  </div>
  <div class="row-2">
    <div class="field">
      <label>Min. huur (€/maand)</label>
      <input type="number" id="min_prijs" value="{{ pref.min_prijs or '' }}" placeholder="0" min="0">
    </div>
    <div class="field">
      <label>Max. huur (€/maand)</label>
      <input type="number" id="max_prijs" value="{{ pref.max_prijs or '' }}" placeholder="1500" min="0">
    </div>
  </div>
  <div class="field">
    <label>Type woning <span style="font-weight:400;color:#a1a1aa">(leeg = alles)</span></label>
    <div class="checks" id="types">
      {% set actieve = pref.type_woning or [] %}
      {% for t in woning_types %}
      <label class="{{ 'active' if t in actieve else '' }}" onclick="toggleActive(this)">
        <input type="checkbox" value="{{ t }}" {{ 'checked' if t in actieve else '' }} style="pointer-events:none"> {{ t }}
      </label>
      {% endfor %}
    </div>
  </div>
  <div class="form-actions">
    <button class="btn btn-primary" style="width:auto" onclick="savePref('{{ redirect_to }}')">{{ submit_label }}</button>
    <a href="/dashboard" class="btn btn-outline">Annuleren</a>
  </div>
</div>

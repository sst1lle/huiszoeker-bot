<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Huursignal{% endblock %}</title>
  <script>document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>
{% block nav %}
<nav>
  <div class="nav-inner">
    <a href="/dashboard" class="logo">Huur<span>signal</span></a>
    <div class="nav-links">
      <a href="/dashboard">Woningen</a>
      <a href="/instellingen">Instellingen</a>
      {% if session.is_admin %}<a href="/admin">Admin</a>{% endif %}
      <button class="theme-btn" id="themeBtn" onclick="toggleTheme()">🌙</button>
      <a href="#" onclick="doLogout()" class="btn-nav btn">Uitloggen</a>
    </div>
  </div>
</nav>
<script src="{{ url_for('static', filename='js/theme.js') }}"></script>
{% endblock %}
{% block content %}{% endblock %}
</body>
</html>
